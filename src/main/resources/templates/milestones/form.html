<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: html}">

</html>

<th:block th:fragment="content" xmlns:th="http://www.thymeleaf.org">
    <div class="page-header">
        <h1 class="page-title" th:text="${milestone.id != null ? '✏️ Sửa mốc kỉ niệm' : '🏆 Thêm mốc kỉ niệm'}">Form
        </h1>
        <a th:href="@{/milestones}" class="btn btn-secondary">← Quay lại</a>
    </div>

    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <form th:action="${milestone.id != null ? '/milestones/' + milestone.id + '/edit' : '/milestones/new'}"
            method="post">
            <div class="form-group">
                <label class="form-label">Tên mốc kỉ niệm *</label>
                <input type="text" name="title" class="form-input" th:value="${milestone.title}"
                    placeholder="Ngày đầu tiên gặp nhau..." required>
            </div>

            <div class="form-group">
                <label class="form-label">Mô tả</label>
                <textarea name="description" class="form-textarea" rows="4"
                    placeholder="Câu chuyện của mốc kỉ niệm này..." th:text="${milestone.description}"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Ngày *</label>
                <input type="date" name="date" class="form-input"
                    th:value="${milestone.date != null ? milestone.date : ''}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Icon (emoji)</label>
                <div class="emoji-picker">
                    <th:block th:each="icon : ${ {'💕', '💘', '💍', '✈️', '🏠', '🎂', '🎉', '🌹', '🥂', '😘'} }">
                        <label>
                            <input type="radio" name="icon" th:value="${icon}" th:checked="${milestone.icon == icon}"
                                style="display: none;">
                            <span class="emoji-btn" th:text="${icon}" onclick="this.parentElement.querySelector('input').checked = true;
                                           document.querySelectorAll('.emoji-btn').forEach(e => e.classList.remove('selected'));
                                           this.classList.add('selected');">💕</span>
                        </label>
                    </th:block>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                <span th:text="${milestone.id != null ? 'Cập nhật' : 'Thêm mốc'}">Submit</span> 🎉
            </button>
        </form>
    </div>
</th:block>
