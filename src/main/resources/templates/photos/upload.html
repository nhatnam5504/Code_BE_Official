<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: html}">

</html>

<th:block th:fragment="content" xmlns:th="http://www.thymeleaf.org">
    <div class="page-header">
        <h1 class="page-title">📸 Upload Ảnh</h1>
        <a th:href="@{/photos}" class="btn btn-secondary">← Quay lại</a>
    </div>

    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <form th:action="@{/photos/upload}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label class="form-label">Chọn ảnh *</label>
                <input type="file" name="file" class="form-input" accept="image/*" required
                    onchange="previewImage(this)">
                <div id="preview" style="margin-top: 1rem; text-align: center;"></div>
            </div>

            <div class="form-group">
                <label class="form-label">Caption</label>
                <input type="text" name="caption" class="form-input" placeholder="Mô tả ảnh...">
            </div>

            <div class="form-group">
                <label class="form-label">Album</label>
                <select name="album" class="form-select">
                    <option value="">-- Không thuộc album --</option>
                    <option th:each="a : ${albums}" th:value="${a}" th:text="${a}">Album</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Hoặc tạo album mới</label>
                <input type="text" name="newAlbum" class="form-input" placeholder="Tên album mới...">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Upload 📸</button>
        </form>
    </div>

    <script>
        function previewImage(input) {
            const preview = document.getElementById('preview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.innerHTML = '<img src="' + e.target.result + '" style="max-width: 100%; max-height: 300px; border-radius: 12px;">';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</th:block>
