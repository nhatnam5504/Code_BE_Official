<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: html}">

</html>

<th:block th:fragment="content" xmlns:th="http://www.thymeleaf.org">
    <a th:href="@{/posts}" class="btn btn-secondary" style="margin-bottom: 1rem;">← Quay lại</a>

    <div class="card" style="max-width: 800px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
            <div>
                <h1 style="margin-bottom: 0.5rem;">
                    <span th:if="${post.mood != null}" th:text="${post.mood.emoji}"
                        style="margin-right: 0.5rem;">😊</span>
                    <span th:text="${post.title}">Title</span>
                </h1>
                <div style="color: #a0a0a0; display: flex; gap: 1rem; font-size: 0.9rem;">
                    <span>📅 <span th:text="${#temporals.format(post.occurredAt, 'dd/MM/yyyy')}">Date</span></span>
                    <span th:switch="${post.visibility.name()}">
                        <span th:case="'BOTH'">👥 Cả hai</span>
                        <span th:case="'ONLY_ME'">🔒 Chỉ mình</span>
                        <span th:case="'ONLY_PARTNER'">💕 Cho người yêu</span>
                    </span>
                </div>
            </div>
            <div th:if="${post.ownerId == userId}" style="display: flex; gap: 0.5rem;">
                <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-secondary btn-small">✏️ Sửa</a>
                <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-danger btn-small"
                        onclick="return confirm('Bạn chắc chắn muốn xóa?')">🗑️ Xóa</button>
                </form>
            </div>
        </div>

        <div style="white-space: pre-wrap; line-height: 1.8;" th:text="${post.content}">Content</div>

        <div
            style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 107, 157, 0.2); color: #a0a0a0; font-size: 0.85rem;">
            Viết lúc <span th:text="${#temporals.format(post.createdAt, 'HH:mm dd/MM/yyyy')}">Time</span>
            <span th:if="${post.updatedAt != null && post.updatedAt != post.createdAt}">
                • Sửa lần cuối <span th:text="${#temporals.format(post.updatedAt, 'HH:mm dd/MM/yyyy')}">Time</span>
            </span>
        </div>
    </div>
</th:block>
