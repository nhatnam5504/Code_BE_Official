<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: html}">

</html>

<th:block th:fragment="content" xmlns:th="http://www.thymeleaf.org">
    <div class="page-header">
        <h1 class="page-title" th:text="${post.id != null ? '✏️ Sửa bài viết' : '📝 Viết mới'}">Form</h1>
        <a th:href="@{/posts}" class="btn btn-secondary">← Quay lại</a>
    </div>

    <div class="card" style="max-width: 800px; margin: 0 auto;">
        <form th:action="${post.id != null ? '/posts/' + post.id + '/edit' : '/posts/new'}" method="post">
            <div class="form-group">
                <label class="form-label">Tiêu đề *</label>
                <input type="text" name="title" class="form-input" th:value="${post.title}"
                    placeholder="Hôm nay là một ngày đặc biệt..." required>
            </div>

            <div class="form-group">
                <label class="form-label">Nội dung *</label>
                <textarea name="content" class="form-textarea" rows="8" placeholder="Viết những gì bạn muốn lưu giữ..."
                    required th:text="${post.content}"></textarea>
            </div>

            <div class="grid grid-2">
                <div class="form-group">
                    <label class="form-label">Cảm xúc</label>
                    <div class="emoji-picker">
                        <th:block th:each="m : ${moods}">
                            <label>
                                <input type="radio" name="mood" th:value="${m.name()}"
                                    th:checked="${post.mood != null && post.mood.name() == m.name()}"
                                    style="display: none;">
                                <span class="emoji-btn" th:text="${m.emoji}" th:title="${m.label}" onclick="this.parentElement.querySelector('input').checked = true; 
                                               document.querySelectorAll('.emoji-btn').forEach(e => e.classList.remove('selected'));
                                               this.classList.add('selected');">😊</span>
                            </label>
                        </th:block>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Ngày sự kiện</label>
                    <input type="date" name="occurredAt" class="form-input"
                        th:value="${post.occurredAt != null ? post.occurredAt : #temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Ai được xem? *</label>
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <th:block th:each="v : ${visibilities}">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="radio" name="visibility" th:value="${v.name()}"
                                th:checked="${post.visibility != null ? post.visibility.name() == v.name() : v.name() == 'BOTH'}"
                                required>
                            <span th:switch="${v.name()}">
                                <span th:case="'BOTH'">👥 Cả hai cùng xem</span>
                                <span th:case="'ONLY_ME'">🔒 Chỉ mình tôi</span>
                                <span th:case="'ONLY_PARTNER'">💕 Chỉ cho người yêu xem</span>
                            </span>
                        </label>
                    </th:block>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                <span th:text="${post.id != null ? 'Cập nhật' : 'Đăng bài'}">Submit</span> 💕
            </button>
        </form>
    </div>
</th:block>
