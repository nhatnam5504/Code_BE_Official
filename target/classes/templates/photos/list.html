<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: html}">

</html>

<th:block th:fragment="content" xmlns:th="http://www.thymeleaf.org">
    <div class="page-header">
        <h1 class="page-title">📸 Album Ảnh</h1>
        <a th:href="@{/photos/upload}" class="btn btn-primary">+ Upload ảnh</a>
    </div>

    <!-- Album Filter -->
    <div class="card" style="display: flex; gap: 0.5rem; flex-wrap: wrap; padding: 1rem;">
        <a th:href="@{/photos}" class="btn" th:classappend="${selectedAlbum == null ? 'btn-primary' : 'btn-secondary'}"
            style="padding: 0.5rem 1rem;">Tất cả</a>
        <a th:each="album : ${albums}" th:href="@{/photos(album=${album})}" th:text="${album}"
            th:classappend="${selectedAlbum == album ? 'btn-primary' : 'btn-secondary'}" class="btn"
            style="padding: 0.5rem 1rem;">Album</a>
    </div>

    <!-- Photo Grid -->
    <div class="photo-grid">
        <div th:each="photo : ${photos}" class="photo-item">
            <a th:href="@{/photos/{id}(id=${photo.id})}">
                <img th:src="${photo.url}" th:alt="${photo.caption}" loading="lazy">
            </a>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(photos)}" style="text-align: center; color: #a0a0a0; padding: 3rem;">
        Chưa có ảnh nào. <a th:href="@{/photos/upload}" style="color: #ff6b9d;">Upload ngay!</a>
    </p>

    <!-- Pagination -->
    <div th:if="${totalPages > 1}" style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 2rem;">
        <a th:if="${currentPage > 0}" th:href="@{/photos(page=${currentPage - 1}, album=${selectedAlbum})}"
            class="btn btn-secondary btn-small">← Trước</a>
        <span style="padding: 0.5rem 1rem;">Trang <span th:text="${currentPage + 1}">1</span> / <span
                th:text="${totalPages}">1</span></span>
        <a th:if="${currentPage < totalPages - 1}" th:href="@{/photos(page=${currentPage + 1}, album=${selectedAlbum})}"
            class="btn btn-secondary btn-small">Tiếp →</a>
    </div>
</th:block>
