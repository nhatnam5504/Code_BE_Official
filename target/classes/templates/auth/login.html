<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Our Love 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6b9d;
            --primary-dark: #c44569;
            --bg-dark: #1a1a2e;
            --bg-card: #16213e;
            --text-light: #ffffff;
            --gradient: linear-gradient(135deg, #ff6b9d 0%, #c44569 50%, #ff9a9e 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated hearts background */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            animation: float 15s infinite;
            opacity: 0.1;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.3;
            }

            90% {
                opacity: 0.3;
            }

            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .login-container {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .login-card {
            background: var(--bg-card);
            border-radius: 30px;
            padding: 3rem;
            width: 400px;
            max-width: 90vw;
            border: 1px solid rgba(255, 107, 157, 0.2);
            box-shadow: 0 20px 60px rgba(255, 107, 157, 0.15);
        }

        .login-logo {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .login-title {
            font-size: 2rem;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: #a0a0a0;
            margin-bottom: 2rem;
        }

        .pin-input {
            width: 100%;
            padding: 1rem;
            font-size: 2rem;
            text-align: center;
            letter-spacing: 1rem;
            border-radius: 15px;
            border: 2px solid rgba(255, 107, 157, 0.3);
            background: var(--bg-dark);
            color: var(--text-light);
            font-family: inherit;
            margin-bottom: 1.5rem;
        }

        .pin-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .pin-input::placeholder {
            letter-spacing: 0.5rem;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
        }

        .error-msg {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
        }
    </style>
</head>

<body>
    <!-- Animated hearts background -->
    <div class="hearts-bg">
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const container = document.querySelector('.hearts-bg');
                const hearts = ['💕', '💗', '💖', '💘', '💝', '❤️', '🩷'];

                for (let i = 0; i < 20; i++) {
                    const heart = document.createElement('span');
                    heart.className = 'heart';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDuration = (15 + Math.random() * 10) + 's';
                    heart.style.animationDelay = Math.random() * 15 + 's';
                    heart.style.fontSize = (15 + Math.random() * 20) + 'px';
                    container.appendChild(heart);
                }
            });
        </script>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">💕</div>
            <h1 class="login-title">Our Love</h1>
            <p class="login-subtitle">Nhập PIN để vào thế giới của chúng mình</p>

            <div th:if="${error}" class="error-msg" th:text="${error}"></div>

            <form th:action="@{/login}" method="post">
                <input type="password" name="pin" class="pin-input" placeholder="••••" maxlength="4" required autofocus
                    pattern="\d{4}" inputmode="numeric">
                <button type="submit" class="login-btn">Vào nhà 🏠</button>
            </form>
        </div>
    </div>
</body>

</html>
