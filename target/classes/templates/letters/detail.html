<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: html}">

</html>

<th:block th:fragment="content" xmlns:th="http://www.thymeleaf.org">
    <a th:href="@{/letters}" class="btn btn-secondary" style="margin-bottom: 1rem;">← Quay lại</a>

    <div style="max-width: 700px; margin: 0 auto;">
        <!-- Letter not openable yet -->
        <div th:unless="${canOpen}" class="card" style="text-align: center; padding: 3rem;">
            <div style="font-size: 4rem; margin-bottom: 1rem;">✉️</div>
            <h2 style="margin-bottom: 1rem;">Thư chưa thể mở!</h2>

            <div th:if="${letter.openType.name() == 'SCHEDULED'}" style="color: #a0a0a0;">
                <p>Thư này sẽ mở vào ngày:</p>
                <p style="font-size: 1.5rem; color: #ff6b9d; margin: 1rem 0;"
                    th:text="${#temporals.format(letter.openAt, 'dd/MM/yyyy')}">Date</p>
                <p>Hãy đợi thêm nhé! 💕</p>
            </div>

            <div th:if="${letter.openType.name() == 'BOTH_CONFIRM'}">
                <p style="color: #a0a0a0; margin-bottom: 1rem;">Cần cả hai người cùng xác nhận để mở thư</p>
                <div style="display: flex; justify-content: center; gap: 2rem; margin: 1.5rem 0;">
                    <div>
                        <span th:if="${letter.senderConfirmed}" style="font-size: 2rem;">✅</span>
                        <span th:unless="${letter.senderConfirmed}" style="font-size: 2rem;">⏳</span>
                        <p>Người gửi</p>
                    </div>
                    <div>
                        <span th:if="${letter.receiverConfirmed}" style="font-size: 2rem;">✅</span>
                        <span th:unless="${letter.receiverConfirmed}" style="font-size: 2rem;">⏳</span>
                        <p>Người nhận</p>
                    </div>
                </div>

                <!-- Confirm button for receiver -->
                <form th:if="${isRecipient && !letter.receiverConfirmed}"
                    th:action="@{/letters/{id}/confirm(id=${letter.id})}" method="post">
                    <button type="submit" class="btn btn-primary">Xác nhận mở thư 💕</button>
                </form>

                <!-- Already confirmed message -->
                <p th:if="${isRecipient && letter.receiverConfirmed}" style="color: #2ecc71;">
                    ✓ Bạn đã xác nhận. Đợi người kia nhé!
                </p>
                <p th:if="${isSender && letter.senderConfirmed && !letter.receiverConfirmed}" style="color: #ffc107;">
                    ✓ Bạn đã xác nhận. Đợi người nhận xác nhận!
                </p>
            </div>
        </div>

        <!-- Letter is open - show content -->
        <div th:if="${canOpen}" class="letter-envelope">
            <div style="text-align: center; margin-bottom: 2rem;">
                <span style="font-size: 3rem;">💌</span>
                <h2 style="margin-top: 0.5rem;">Thư từ <span th:text="${isSender ? 'bạn' : 'người yêu'}">người
                        yêu</span></h2>
                <small style="color: #666;"
                    th:text="${#temporals.format(letter.createdAt, 'HH:mm dd/MM/yyyy')}">Date</small>
            </div>

            <div style="background: white; padding: 2rem; border-radius: 12px; min-height: 200px; white-space: pre-wrap; line-height: 1.8; font-size: 1.1rem;"
                th:text="${letter.content}">
                Content
            </div>

            <div style="text-align: center; margin-top: 2rem; font-size: 2rem;">
                💕💕💕
            </div>
        </div>
    </div>
</th:block>
