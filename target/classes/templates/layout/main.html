<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' | Our Love' : 'Our Love 💕'}">Our Love</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style th:inline="text">
        :root {
            --primary: #ff6b9d;
            --primary-dark: #c44569;
            --secondary: #ff9a9e;
            --accent: #fecfef;
            --bg-dark: #1a1a2e;
            --bg-card: #16213e;
            --bg-card-hover: #1f3460;
            --text-light: #ffffff;
            --text-muted: #a0a0a0;
            --gradient: linear-gradient(135deg, #ff6b9d 0%, #c44569 50%, #ff9a9e 100%);
            --shadow: 0 10px 40px rgba(255, 107, 157, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Navigation */
        .navbar {
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 107, 157, 0.2);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-links a:hover, .nav-links a.active {
            background: var(--gradient);
            color: white;
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-user-name {
            font-weight: 600;
        }

        /* Main content */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 107, 157, 0.1);
            transition: all 0.3s ease;
        }

        .card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--primary);
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 2px solid rgba(255, 107, 157, 0.3);
            background: var(--bg-dark);
            color: var(--text-light);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* Alerts */
        .alert {
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .alert-success {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
            color: #2ecc71;
        }

        .alert-error {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
        }

        /* Page header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Grid */
        .grid {
            display: grid;
            gap: 1.5rem;
        }

        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }

        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4 {
                grid-template-columns: 1fr;
            }
            .nav-links {
                display: none;
            }
        }

        /* Emoji picker */
        .emoji-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .emoji-btn {
            font-size: 2rem;
            padding: 0.5rem;
            background: var(--bg-dark);
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .emoji-btn:hover, .emoji-btn.selected {
            border-color: var(--primary);
            transform: scale(1.1);
        }

        /* Timeline */
        .timeline {
            position: relative;
            padding-left: 2rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--gradient);
            border-radius: 3px;
        }

        .timeline-item {
            position: relative;
            padding-left: 2rem;
            margin-bottom: 2rem;
        }

        .timeline-dot {
            position: absolute;
            left: -2.5rem;
            top: 0;
            width: 2rem;
            height: 2rem;
            background: var(--bg-card);
            border: 3px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        /* Photo grid */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .photo-item {
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .photo-item:hover img {
            transform: scale(1.1);
        }

        /* Letter styles */
        .letter-envelope {
            background: linear-gradient(135deg, #fef3c7 0%, #fcd34d 100%);
            color: #1a1a2e;
            padding: 2rem;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }

        .letter-sealed {
            filter: blur(5px);
            user-select: none;
        }

        .letter-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
        }

        /* Stats card */
        .stat-card {
            text-align: center;
            padding: 2rem;
        }

        .stat-number {
            font-size: 3rem;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        /* Mood display */
        .mood-emoji {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        /* Mobile nav */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(22, 33, 62, 0.98);
            padding: 0.5rem;
            border-top: 1px solid rgba(255, 107, 157, 0.2);
            z-index: 100;
        }

        .mobile-nav-links {
            display: flex;
            justify-content: space-around;
            list-style: none;
        }

        .mobile-nav-links a {
            color: var(--text-light);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            padding: 0.5rem;
        }

        .mobile-nav-links a span {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        @media (max-width: 768px) {
            .mobile-nav {
                display: block;
            }
            .main-content {
                padding-bottom: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" th:if="${session.user != null}">
        <div class="nav-container">
            <a href="/" class="nav-logo">Our Love 💕</a>
            <ul class="nav-links">
                <li><a th:href="@{/}" th:classappend="${#request.requestURI == '/' ? 'active' : ''}">🏠 Trang chủ</a></li>
                <li><a th:href="@{/photos}" th:classappend="${#request.requestURI.startsWith('/photos') ? 'active' : ''}">📸 Ảnh</a></li>
                <li><a th:href="@{/posts}" th:classappend="${#request.requestURI.startsWith('/posts') ? 'active' : ''}">📝 Nhật ký</a></li>
                <li><a th:href="@{/milestones}" th:classappend="${#request.requestURI.startsWith('/milestones') ? 'active' : ''}">🏆 Kỉ niệm</a></li>
                <li><a th:href="@{/letters}" th:classappend="${#request.requestURI.startsWith('/letters') ? 'active' : ''}">💌 Thư</a></li>
                <li><a th:href="@{/mood}" th:classappend="${#request.requestURI.startsWith('/mood') ? 'active' : ''}">😊 Cảm xúc</a></li>
            </ul>
            <div class="nav-user">
                <span class="nav-user-name" th:text="${session.user.name}">User</span>
                <a th:href="@{/logout}" class="btn btn-secondary btn-small">Đăng xuất</a>
            </div>
        </div>
    </nav>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav" th:if="${session.user != null}">
        <ul class="mobile-nav-links">
            <li><a th:href="@{/}"><span>🏠</span>Home</a></li>
            <li><a th:href="@{/photos}"><span>📸</span>Ảnh</a></li>
            <li><a th:href="@{/posts}"><span>📝</span>Nhật ký</a></li>
            <li><a th:href="@{/milestones}"><span>🏆</span>Kỉ niệm</a></li>
            <li><a th:href="@{/letters}"><span>💌</span>Thư</a></li>
            <li><a th:href="@{/mood}"><span>😊</span>Mood</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Flash messages -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <!-- Page content will be inserted here by child templates -->
        <div th:replace="${content}">
            <!-- Content placeholder -->
        </div>
    </main>
</body>
</html>
